name: Build turbo firmware

# Two tracks.
#   board: unmodified adafruit/circuitpython at a release tag with
#          CIRCUITPY_ENABLE_MPY_NATIVE=1 on the make line. No fork, no patches.
#          The flag turns on the Thumb native emitter already in every tree.
#   esp32: the esp32-native branch of the mikeysklar/circuitpython fork, which
#          adds the Xtensa emitter, an executable-RAM allocator and the
#          non-ARM pointer fix. Not a stock tag.

on:
  workflow_dispatch:
    inputs:
      cp_version:
        description: CircuitPython tag to build
        required: true
        default: "10.3.0"
      esp32_ref:
        description: Fork branch for the ESP32 boards
        required: true
        default: "esp32-native"
  push:
    branches: [main]
    paths: [".github/workflows/firmware.yml"]

env:
  CP_VERSION: ${{ inputs.cp_version || '10.3.0' }}
  ESP32_REF: ${{ inputs.esp32_ref || 'esp32-native' }}

jobs:
  board:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: adafruit_metro_rp2040
            port: raspberrypi
            arch: armv6m
          - board: adafruit_metro_rp2350
            port: raspberrypi
            arch: armv7emsp
          - board: feather_nrf52840_express
            port: nordic
            arch: armv7emsp
          - board: feather_stm32f405_express
            port: stm
            arch: armv7emsp
    steps:
      # CircuitPython goes at the workspace root so its own composite actions
      # (./.github/actions/...) resolve, same as its CI.
      - name: Check out CircuitPython ${{ env.CP_VERSION }}
        uses: actions/checkout@v6
        with:
          repository: adafruit/circuitpython
          ref: ${{ env.CP_VERSION }}
          submodules: false
          show-progress: false
          fetch-depth: 1
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Set up port
        uses: ./.github/actions/deps/ports
        with:
          board: ${{ matrix.board }}
          port: ${{ matrix.port }}

      - name: Set up submodules
        uses: ./.github/actions/deps/submodules
        with:
          target: ${{ matrix.board }}

      - name: Set up external (arm toolchain, python deps)
        uses: ./.github/actions/deps/external
        with:
          port: ${{ matrix.port }}

      - name: Versions
        run: |
          arm-none-eabi-gcc --version | head -1
          python3 --version

      - name: Build mpy-cross
        run: make -C mpy-cross -j4

      - name: Build ${{ matrix.board }} with CIRCUITPY_ENABLE_MPY_NATIVE=1
        run: |
          make -C ports/${{ matrix.port }} BOARD=${{ matrix.board }} \
               CIRCUITPY_ENABLE_MPY_NATIVE=1 -j4

      - name: Verify the emitter is in the image
        run: |
          elf=ports/${{ matrix.port }}/build-${{ matrix.board }}/firmware.elf
          n=$(arm-none-eabi-nm "$elf" | grep -c -E 'emit_native_thumb|asm_thumb_|mp_native_relocate' || true)
          echo "native emitter symbols: $n"
          test "$n" -gt 0

      - name: Collect
        run: |
          out=out/${{ matrix.board }}
          mkdir -p "$out"
          b=ports/${{ matrix.port }}/build-${{ matrix.board }}
          for ext in uf2 bin hex; do
            if [ -f "$b/firmware.$ext" ]; then
              cp "$b/firmware.$ext" \
                 "$out/adafruit-circuitpython-${{ matrix.board }}-turbo-${CP_VERSION}.$ext"
            fi
          done
          {
            echo "board=${{ matrix.board }}"
            echo "port=${{ matrix.port }}"
            echo "arch=${{ matrix.arch }}"
            echo "cp_version=${CP_VERSION}"
            echo "source=adafruit/circuitpython@${CP_VERSION}"
            echo "cp_commit=$(git rev-parse HEAD)"
            echo "gcc=$(arm-none-eabi-gcc -dumpfullversion)"
            echo "flags=CIRCUITPY_ENABLE_MPY_NATIVE=1"
          } > "$out/BUILD.txt"
          ls -l "$out"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}
          path: out/${{ matrix.board }}

      - name: Upload mpy-cross
        if: matrix.board == 'adafruit_metro_rp2350'
        uses: actions/upload-artifact@v7
        with:
          name: mpy-cross-linux-${{ env.CP_VERSION }}
          path: mpy-cross/build/mpy-cross

  # ESP32 boards build from the fork branch that carries the Xtensa emitter
  # work. Same composite actions as CircuitPython's own CI; deps/external
  # installs the IDF tools and puts the xtensa toolchain on PATH.
  esp32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: adafruit_metro_esp32s2
            arch: xtensawin
          - board: adafruit_metro_esp32s3
            arch: xtensawin
          - board: adafruit_matrixportal_s3
            arch: xtensawin
    steps:
      - name: Check out mikeysklar/circuitpython@${{ env.ESP32_REF }}
        uses: actions/checkout@v6
        with:
          repository: mikeysklar/circuitpython
          ref: ${{ env.ESP32_REF }}
          submodules: false
          show-progress: false
          fetch-depth: 1
          persist-credentials: false

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Set up port
        uses: ./.github/actions/deps/ports
        with:
          board: ${{ matrix.board }}
          port: espressif

      - name: Set up submodules
        uses: ./.github/actions/deps/submodules
        with:
          target: ${{ matrix.board }}

      - name: Set up external (IDF tools, python deps)
        uses: ./.github/actions/deps/external
        with:
          port: espressif

      - name: Versions
        run: |
          xtensa-esp-elf-gcc --version | head -1
          python3 --version

      - name: Build mpy-cross
        run: make -C mpy-cross -j4

      - name: Build ${{ matrix.board }} with CIRCUITPY_ENABLE_MPY_NATIVE=1
        run: |
          make -C ports/espressif BOARD=${{ matrix.board }} \
               CIRCUITPY_ENABLE_MPY_NATIVE=1 -j4

      - name: Verify the emitter and the exec allocator are in the image
        run: |
          elf=ports/espressif/build-${{ matrix.board }}/firmware.elf
          n=$(xtensa-esp-elf-nm "$elf" | grep -c -E 'emit_native_xtensa|esp_native_code_commit' || true)
          echo "native symbols: $n"
          test "$n" -gt 0
          grep -q '^# CONFIG_ESP_SYSTEM_MEMPROT is not set' ports/espressif/build-${{ matrix.board }}/esp-idf/sdkconfig

      - name: Collect
        run: |
          out=out/${{ matrix.board }}
          mkdir -p "$out"
          b=ports/espressif/build-${{ matrix.board }}
          for ext in uf2 bin; do
            if [ -f "$b/firmware.$ext" ]; then
              cp "$b/firmware.$ext" \
                 "$out/adafruit-circuitpython-${{ matrix.board }}-turbo-${CP_VERSION}.$ext"
            fi
          done
          {
            echo "board=${{ matrix.board }}"
            echo "port=espressif"
            echo "arch=${{ matrix.arch }}"
            echo "cp_version=${CP_VERSION}"
            echo "source=mikeysklar/circuitpython@${ESP32_REF}"
            echo "cp_commit=$(git rev-parse HEAD)"
            echo "gcc=$(xtensa-esp-elf-gcc -dumpfullversion)"
            echo "flags=CIRCUITPY_ENABLE_MPY_NATIVE=1"
          } > "$out/BUILD.txt"
          ls -l "$out"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}
          path: out/${{ matrix.board }}

  # Manual runs publish a release on this repo. Pushes that only touch the
  # workflow stay artifact-only so a CI tweak does not mint a release.
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [board, esp32]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Assemble release files
        run: |
          mkdir -p release
          for d in dist/*/; do
            b=$(basename "$d")
            case "$b" in
              mpy-cross-*) cp "$d/mpy-cross" "release/$b"; chmod +x "release/$b" ;;
              *) for f in "$d"/*; do
                   case "$f" in *BUILD.txt) cp "$f" "release/$b-BUILD.txt" ;; *) cp "$f" release/ ;; esac
                 done ;;
            esac
          done
          {
            echo "CircuitPython ${CP_VERSION} with the native emitter on. \`@micropython.native\` and \`@micropython.viper\` work, and \`mpy-cross -march=<arch>\` output loads."
            echo
            table() {
              echo "| Board | Arch | UF2 |"
              echo "|---|---|---|"
              for t in release/*-BUILD.txt; do
                grep -q "^source=$1" "$t" || continue
                board=$(sed -n 's/^board=//p' "$t"); arch=$(sed -n 's/^arch=//p' "$t")
                uf2=$(ls release/adafruit-circuitpython-${board}-turbo-*.uf2 | xargs -n1 basename)
                echo "| $board | \`$arch\` | $uf2 |"
              done
            }
            echo "### ARM, stock tag"
            echo "Unmodified adafruit/circuitpython at \`${CP_VERSION}\` with \`CIRCUITPY_ENABLE_MPY_NATIVE=1\`. Same firmware as the Adafruit release plus the emitter."
            echo
            table adafruit/circuitpython
            echo
            echo "### ESP32, fork branch"
            echo "Built from \`mikeysklar/circuitpython@${ESP32_REF}\` (based on \`${CP_VERSION}\`), which adds the Xtensa emitter, an executable-RAM allocator, turns memory protection off, and fixes a non-ARM pointer bug. Not a stock tag."
            echo
            table mikeysklar/circuitpython
            echo
            echo "\`mpy-cross-linux-${CP_VERSION}\` is the matching compiler, Linux x86_64. Adafruit also publishes mpy-cross for every release."
            echo
            arm_t=$(grep -l '^source=adafruit/circuitpython' release/*-BUILD.txt | head -1)
            esp_t=$(grep -l '^source=mikeysklar/circuitpython' release/*-BUILD.txt | head -1)
            echo "ARM: adafruit/circuitpython commit $(sed -n 's/^cp_commit=//p' $arm_t), GCC $(sed -n 's/^gcc=//p' $arm_t). ESP32: mikeysklar/circuitpython commit $(sed -n 's/^cp_commit=//p' $esp_t), GCC $(sed -n 's/^gcc=//p' $esp_t)."
          } > notes.md
          ls -l release; cat notes.md

      - name: Create or update release cp-${{ env.CP_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cp-${CP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "CircuitPython ${CP_VERSION} turbo" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" release/* --clobber
